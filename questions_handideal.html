<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Saisie Forum Handidéal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Concept : saisie guidée sur tablette, un écran par étape (participant, choix du prototype, questions, suite). Typographie lisible, grandes zones tactiles. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --fg:#1D2130; --muted:#5A6073; --line:#C9CDD8;
  --primary:#2B3040; --on-primary:#FFFFFF; --accent:#B35F00; --accent-soft:#FDF1E0;
  --ok:#1F7A3D; --warn:#9A5B00; --focus:#0B5FD7;
  --tg:#1B7F79; --tm:#A8650A; --tb:#B04535; --on-tone:#FFFFFF;
  --k0:#2F5DA8; --k1:#7A4E9E; --k2:#4E7F4A; --k3:#A8566B; --k4:#8A6A1F; --k5:#5E6677;
  --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151C; --surface:#1D2029; --fg:#EEF0F6; --muted:#A5ABBD; --line:#3A3F50;
  --primary:#F28C00; --on-primary:#13151C; --accent:#F5A53A; --accent-soft:#2A2418;
    --tg:#4FC3B9; --tm:#F0B755; --tb:#F08A7A; --on-tone:#13151C;
  --k0:#7DA7F0; --k1:#C09BE0; --k2:#8FCB88; --k3:#E59AAE; --k4:#D9B85A; --k5:#A9B1C2;
  --ok:#5BC37D; --warn:#F5B85A; --focus:#7DB1FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151C; --surface:#1D2029; --fg:#EEF0F6; --muted:#A5ABBD; --line:#3A3F50;
  --primary:#F28C00; --on-primary:#13151C; --accent:#F5A53A; --accent-soft:#2A2418;
    --tg:#4FC3B9; --tm:#F0B755; --tb:#F08A7A; --on-tone:#13151C;
  --k0:#7DA7F0; --k1:#C09BE0; --k2:#8FCB88; --k3:#E59AAE; --k4:#D9B85A; --k5:#A9B1C2;
  --ok:#5BC37D; --warn:#F5B85A; --focus:#7DB1FF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:2px solid var(--line);margin-bottom:22px}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;font-weight:700}
.chip button{min-height:40px;padding:0 16px}
.mock{background:var(--accent-soft);border-left:6px solid var(--accent);padding:10px 14px;margin:0 0 22px;font-size:.92rem;border-radius:4px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h2{font-size:1.3rem;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 22px}
section.card{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:20px;margin:0 0 20px}
label.f{display:block;font-weight:700;margin:0 0 8px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;width:100%;min-height:52px}
textarea{min-height:130px;resize:vertical}
input.num{font-size:1.6rem;font-weight:700;letter-spacing:.08em;max-width:240px;text-transform:uppercase}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--primary);background:var(--surface);color:var(--fg);min-height:52px;padding:0 22px;font-weight:700}
button.primary{background:var(--primary);color:var(--on-primary)}
button.ghost{border-color:var(--line);font-weight:400}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.err{color:var(--warn);font-weight:700;margin:8px 0 0}
.ok{color:var(--ok);font-weight:700}
/* options */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;min-width:96px;padding:8px 18px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-weight:700}
.opt input:checked+span{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.opt input:focus-visible+span{outline:4px solid var(--focus);outline-offset:2px}
.opt input[type=checkbox]:checked+span::before{content:"\2713\00a0"}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q>.t{font-weight:700;margin:0 0 10px}
.q>.h{color:var(--muted);font-size:.9rem;margin:-6px 0 10px}
.scalerow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px 18px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.scalerow:first-of-type{border-top:0}
.scalerow .opts{flex-wrap:nowrap}
.scalerow .opt{flex:1}
.scalerow .opt span{min-width:0;padding:8px 6px}
.mrow{padding:12px 0;border-top:1px dashed var(--line)}
.mrow:first-of-type{border-top:0}
.mcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mcols .c{font-size:.9rem;color:var(--muted);margin:0 0 4px;font-weight:700}
.opts.tight{flex-wrap:nowrap}.opts.tight .opt{flex:1}.opts.tight .opt span{min-width:0;padding:8px 4px}
.timing{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.timing .hd{font-size:.82rem;color:var(--muted);font-weight:700}
.timing input,.timing select{min-height:46px;padding:8px 10px}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.proto{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:112px;padding:14px 16px;background:var(--surface);border:2px solid var(--line);width:100%}
.proto:hover{border-color:var(--primary)}
.proto .n{font-size:.85rem;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.proto .tt{font-size:1.1rem;font-weight:700}
.proto.done{border-color:var(--ok)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;margin-bottom:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.bar .prog{color:var(--muted);font-size:.95rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.tw{overflow-x:auto}
pre.csv{background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px;max-height:220px;overflow:auto;font-size:.8rem;white-space:pre}
.bigchoice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.bigchoice button{min-height:96px;font-size:1.15rem;text-align:left;padding:14px 18px}
.bigchoice button small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.bigchoice button.primary small{color:inherit;opacity:.85}
@media(max-width:560px){body{font-size:17px}.scalerow{grid-template-columns:1fr}.timing{grid-template-columns:1fr 1fr}.timing .hd{display:none}.timing .fmt{grid-column:1/-1;font-weight:700}}
@media(prefers-reduced-motion:no-preference){button,.opt span{transition:background .12s,border-color .12s}}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:46px;padding:0 18px;border-color:var(--line);font-weight:700}
.tabs button[aria-current=page]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.roleinfo{color:var(--muted);font-size:.9rem;margin:-8px 0 18px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-height:300px;overflow:auto;padding:4px}
.pchip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;padding:6px 8px;background:var(--bg);border:2px solid var(--line);font-weight:700}
.pchip small{font-weight:400;color:var(--muted);font-size:.8rem}
.pchip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pchip[aria-pressed=true] small{color:inherit;opacity:.85}
.toast{background:var(--surface);border:2px solid var(--ok);border-left-width:8px;border-radius:8px;padding:12px 16px;margin:0 0 20px;font-weight:700}
.proto:disabled{opacity:.5;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--surface);color:var(--fg);border:3px solid var(--warn);border-radius:12px;max-width:520px;width:100%;padding:22px}
.dlg h2{margin:0 0 8px}
.pilltag{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.88rem;margin:2px 6px 2px 0;background:var(--bg)}
.timing{grid-template-columns:minmax(0,1.3fr) repeat(5,minmax(0,1fr))}
@media(max-width:560px){.timing{grid-template-columns:1fr 1fr}}

.muted{color:var(--muted)}
.sub{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap;align-items:center}
.fgroup{margin:0 0 16px}.fgroup .t{font-weight:700;margin:0 0 8px}
.fchip{min-height:42px;padding:4px 14px;border:2px solid var(--line);border-radius:999px;background:var(--bg);font-weight:700;font-size:.95rem}
.fchip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cmp{border-collapse:separate;border-spacing:0;font-size:.92rem}
.cmp th,.cmp td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;min-width:150px;background:var(--surface)}
.cmp th{background:var(--bg)}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;min-width:230px;max-width:300px;z-index:1;background:var(--bg);font-weight:700}
.pill{display:inline-block;border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:.85rem;font-weight:700;color:var(--on-tone)}
.mean{margin-top:4px;color:var(--muted);font-size:.85rem}
.cm{margin:0 0 6px;font-size:.88rem;font-weight:400}
.tg{background:var(--tg)}.tm{background:var(--tm)}.tb{background:var(--tb)}
.k0{background:var(--k0)}.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}.k4{background:var(--k4)}.k5{background:var(--k5)}
.qchart{padding:14px 0;border-top:1px solid var(--line)}.qchart:first-of-type{border-top:0}
.qt{font-weight:700;margin:0 0 6px}
.legend{margin:0 0 8px}
.bar-row{display:grid;grid-template-columns:minmax(96px,170px) 1fr 70px;gap:10px;align-items:center;margin:5px 0}
.bl{font-size:.9rem}.bl small{color:var(--muted)}
.bm{font-size:.88rem;color:var(--muted);text-align:right}
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.seg{display:flex;align-items:center;justify-content:center;min-width:26px;color:var(--on-tone);font-weight:700;font-size:.85rem}
.seg-empty{height:34px;display:flex;align-items:center;color:var(--muted);font-size:.85rem}
.hb{height:22px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hbf{display:block;height:100%}
.ov{margin:10px 0 16px}.ovl{font-weight:700;margin-bottom:4px}
@media(max-width:560px){.bar-row{grid-template-columns:1fr 60px}.bar-row .bl{grid-column:1/-1}}

.vrow{display:flex;gap:10px;margin:0 0 12px}
.vf{flex:1;text-align:center;border-top:5px solid var(--vc);border-radius:8px;background:color-mix(in srgb,var(--vc) 12%,var(--surface));padding:8px 4px}
.vf span{display:block;font-weight:700;margin-top:2px}
.vimg{display:block;margin:0 auto 4px;height:64px;width:auto;max-width:100%;object-fit:contain}
.mcols .mc{border-radius:8px;padding:8px}
.mcols .mc[style]{border-top:5px solid var(--vc);background:color-mix(in srgb,var(--vc) 12%,var(--surface))}
.mcols .mc[style] .c{color:var(--fg);text-align:center}
</style>
</head>

<div class="wrap">
<header class="top">
  <div class="brand">Bus Handidéal<small>Forum les Accessibles, 20 et 21 novembre 2026</small></div>
  <nav class="tabs" id="nav" aria-label="Rôle"></nav>
</header>
<main id="app" aria-live="polite"></main>
</div>

let CODE='', ROLE='';
try{CODE=sessionStorage.getItem('hd_code')||'';ROLE=sessionStorage.getItem('hd_role')||''}catch(e){}
async function api(fn,args){
  const h={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
  if(SUPABASE_KEY.startsWith('eyJ')) h['Authorization']='Bearer '+SUPABASE_KEY;
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:h,body:JSON.stringify(args)});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){} const e=new Error(m||('Erreur '+r.status));e.status=r.status;throw e}
  const t=await r.text(); return t?JSON.parse(t):null;
}
/* File d'attente locale : une saisie n'est jamais perdue si le réseau coupe */
const QKEY='hd_queue_v1';
function getQ(){try{return JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){return []}}
function setQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
async function flush(){
  let q=getQ(), sent=0, last='';
  for(const it of [...q]){
    try{await api('submit_reponse',it.args); q=getQ().filter(x=>x.id!==it.id); setQ(q); sent++}
    catch(e){ if(e.status===undefined) {last='réseau indisponible';break} last=e.message; it.err=e.message; setQ(getQ().map(x=>x.id===it.id?it:x)) }
  }
  return {sent,left:getQ().length,last};
}

    return `<div class="q" data-it="${k}">${t}${it.imgs?`<div class="vrow">${it.imgs.map((v,j)=>`<div class="vf" style="--vc:${VTONE[j]}"><img class="vimg" src="${VIMG[v]}" alt="Version ${v}"><span>Version ${v}</span></div>`).join('')}</div>`:''}${optHTML(k,it.opts,'checkbox',cur,'',dis)}</div>`}
  if(it.type==='scale') return `<div class="q" data-it="${k}">${t}${it.rows.map((r,i)=>`<div class="scalerow"><div>${esc(r)}</div>${optHTML(k+'.'+i,it.opts,'radio',S.ans[k+'.'+i])}</div>`).join('')}</div>`;
  if(it.type==='matrix') return `<div class="q" data-it="${k}">${t}${it.rows.map((r,i)=>`<div class="mrow"><div style="font-weight:700;margin-bottom:8px">${esc(r)}</div><div class="mcols">${it.cols.map((c,j)=>`<div class="mc"${it.tones?` style="--vc:${it.tones[j]}"`:''}>${it.imgs?`<img class="vimg" src="${VIMG[it.imgs[j]]}" alt="Boîtier ${esc(c)}">`:''}<div class="c">${esc(c)}</div>${optHTML(k+'.'+i+'.'+j,it.opts,'radio',S.ans[k+'.'+i+'.'+j],'tight')}</div>`).join('')}</div></div>`).join('')}</div>`;
  if(it.type==='timing'){
    const H='<div class="hd">Format (trajet)</div><div class="hd">Ordre de passage</div><div class="hd">Montée (s)</div><div class="hd">Arrêt avant (s)</div><div class="hd">Descente (s)</div><div class="hd">3 arrêts trouvés ?</div>';
    return `<div class="q" data-it="${k}">${t}<div class="timing">${H}${it.rows.map((r,i)=>{

      const sel=(n,opts,lab)=>`<select data-k="${k}.${i}.${n}" aria-label="${lab}"><option value="">${lab==='Ordre de passage'?'Ordre':'—'}</option>${opts.map(o=>`<option ${S.ans[k+'.'+i+'.'+n]===o?'selected':''}>${o}</option>`).join('')}</select>`;
      return `<div class="fmt">${esc(r)}</div>${sel('o',['1er','2e','3e'],'Ordre de passage')}
      ${['m','a','d'].map(n=>`<input type="number" min="0" inputmode="numeric" data-k="${k}.${i}.${n}" value="${v(n)}" aria-label="${n==='m'?'Montée':n==='a'?'Arrêt avant':'Descente'} en secondes" placeholder="s">`).join('')}${sel('t',['Oui','Non'],'Trouvés')}`}).join('')}</div></div>`;
  }
  return '';
}
function requiredKeys(q){

  });
  return ks;
}

  app.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(i=>i.onchange=()=>{
    const n=i.name;

    if(i.type==='checkbox'){
      const set=new Set(S.ans[n]||[]);i.checked?set.add(i.value):set.delete(i.value);S.ans[n]=[...set];
      const it=all.find(x=>x.id===n); if(it&&it.max){
        app.querySelectorAll(`input[name="${n}"]`).forEach(c=>{c.disabled=S.ans[n].length>=it.max&&!c.checked});

  $('#comment').oninput=e=>S.comment=e.target.value; $('#obs').oninput=e=>S.obs=e.target.value;

    const btn=$('#saveBtn'); btn.disabled=true; btn.textContent='Enregistrement…';
    const args={p_code:CODE,p_client_id:uid(),p_participant:S.pid,p_questionnaire:q.id,p_jour:S.jour,p_rempli:S.aide,p_reponses:{...S.ans},p_commentaire:S.comment,p_observations:S.obs};
    const qq=getQ(); qq.push({id:args.p_client_id,args}); setQ(qq);
    const r=await flush(); const pid=S.pid;
    S.toast=r.left?`Prototype ${q.num} gardé en attente pour ${pid} (${r.last||'à renvoyer'}). Il sera envoyé dès que possible.`:`Prototype ${q.num} enregistré pour ${pid}.`;
    S.pid=null;S.filter='';S.view='home';S.parts=null;render();window.scrollTo(0,0);
  };
  upd();
}

const pad=n=>String(n).padStart(2,'0');
const fmtParis=iso=>{try{return new Date(iso).toLocaleString('sv-SE',{timeZone:'Europe/Paris'}).slice(0,16)}catch(e){return iso||''}};
/* colonnes lisibles d'un questionnaire : [{key,label,opts?}] */
function columnsOf(q){
  const cols=[];
  [...q.items,...(q.anim||[])].forEach(it=>{
    if(it.type==='single'||it.type==='multi') cols.push({key:it.id,label:it.q,kind:it.type,opts:it.opts});
    else if(it.type==='scale') it.rows.forEach((r,i)=>cols.push({key:it.id+'.'+i,label:it.q+' – '+r,kind:'single',opts:it.opts}));
    else if(it.type==='matrix') it.rows.forEach((r,i)=>it.cols.forEach((c,j)=>cols.push({key:it.id+'.'+i+'.'+j,label:it.q+' – '+r+' – '+c,kind:'single',opts:it.opts})));
    else if(it.type==='timing') it.rows.forEach((r,i)=>[['o','ordre de passage'],['m','montée (s)'],['a','arrêt avant (s)'],['d','descente (s)'],['t','3 arrêts trouvés']].forEach(([k,l])=>cols.push({key:it.id+'.'+i+'.'+k,label:r+' – '+l,kind:'single'})));
  });
  return cols;
}
const val=(r,c)=>{const v=(r.reponses||{})[c.key];return Array.isArray(v)?v.join(' | '):(v??'')};
const numOrText=v=>(v!==''&&!isNaN(v))?Number(v):v;
function csvLong(ex){
  const out=['participant;prototype;date;jour;rempli;code_question;valeur'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  ex.reponses.forEach(r=>{
    const base=[r.participant,r.questionnaire,fmtParis(r.created_at),r.jour||'',r.rempli||''];
    Object.entries(r.reponses||{}).forEach(([k,v])=>out.push([...base,r.questionnaire+'.'+k,q(Array.isArray(v)?v.join(' | '):v)].join(';')));
    out.push([...base,r.questionnaire+'.commentaire',q(r.commentaire)].join(';'));
    out.push([...base,r.questionnaire+'.observations',q(r.observations)].join(';'));
  });
  return out.join('\n');
}
function buildWorkbook(ex){
  const wb=XLSX.utils.book_new();
  const add=(name,rows,widths)=>{const ws=XLSX.utils.aoa_to_sheet(rows);if(widths)ws['!cols']=widths.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,name)};
  // Participants
  add('Participants',[['Participant','Statut','Déplacement','Prend le bus','Essais dans le bus','Acquisitions proto 4','Questionnaires remplis'],
    ...ex.participants.map(p=>{const f=p.profil||{};return [p.numero,f.statut||'',(f.depl||[]).join(' | '),f.bus||'',f.essais||'',f.etude||'',ex.reponses.filter(r=>r.participant===p.numero).length]})],[12,18,28,14,18,20,20]);
  // Synthèse (effectifs par modalité)
  const syn=[['Prototype','Question','Réponse','Effectif','% des questionnaires du prototype','Nb de questionnaires']];
  QS.forEach(q=>{
    const rs=ex.reponses.filter(r=>r.questionnaire===q.id); if(!rs.length) return;
    columnsOf(q).forEach(c=>{
      if(!c.opts) return;
      c.opts.forEach(o=>{
        const n=rs.filter(r=>{const v=(r.reponses||{})[c.key];return Array.isArray(v)?v.includes(o):v===o}).length;
        syn.push(['Proto '+q.num+' – '+q.titre,c.label,o,n,Math.round(1000*n/rs.length)/1000,rs.length]);
      });
    });
  });
  add('Synthèse',syn,[34,70,28,10,20,16]);
  // Un onglet par prototype (une ligne par questionnaire)
  QS.forEach(q=>{
    const cols=columnsOf(q), rs=ex.reponses.filter(r=>r.questionnaire===q.id);
    const head=['Participant','Date','Jour','Rempli',...cols.map(c=>c.label),'Commentaires libres','Observations animateur'];
    const rows=rs.map(r=>[r.participant,fmtParis(r.created_at),r.jour||'',r.rempli||'',...cols.map(c=>numOrText(val(r,c))),r.commentaire||'',r.observations||'']);
    add('Proto '+q.num,[head,...rows],[12,16,9,10,...cols.map(()=>24),50,40]);
  });
  // Format long (tableaux croisés dynamiques)
  const long=[['Participant','Prototype','Date','Jour','Rempli','Question','Réponse']];
  ex.reponses.forEach(r=>{const q=QS.find(x=>x.id===r.questionnaire);if(!q)return;
    columnsOf(q).forEach(c=>{const v=val(r,c);if(v!=='')long.push([r.participant,q.num,fmtParis(r.created_at),r.jour||'',r.rempli||'',c.label,numOrText(v)])});
    if(r.commentaire) long.push([r.participant,q.num,fmtParis(r.created_at),r.jour||'',r.rempli||'','Commentaires libres',r.commentaire]);});
  add('Format long',long,[12,10,16,9,10,70,40]);
  return wb;
}
let EXPORT=null;
const A={sub:'export',f:{statut:[],depl:[],bus:[],jour:[],rempli:[]},parts:[],target:'overview',by:'none',view:'tableau'};
const SCORE={'Oui':2,'Un peu':1,'Non':0,'Peut-être':1,'Moyen':1};
const scorable=c=>c.opts&&c.opts.length===3&&c.opts.every(o=>o in SCORE);
const TONE={'Oui':'tg','Un peu':'tm','Peut-être':'tm','Moyen':'tm','Non':'tb'};
const toneOf=(o,i)=>TONE[o]||('k'+(i%6));
const f1=x=>x==null?'—':x.toFixed(1).replace('.',',');
const pc=x=>x==null?'—':Math.round(x*100)+' %';
const NR='Non renseigné';

function popRows(ex){
  const prof=Object.fromEntries(ex.participants.map(p=>[p.numero,p.profil||{}]));
  const f=A.f;
  const okP=n=>{const p=prof[n]||{};
    if(f.statut.length&&!f.statut.includes(p.statut||NR)) return false;
    if(f.depl.length){const d=p.depl||[]; if(!(d.length?d.some(x=>f.depl.includes(x)):f.depl.includes(NR))) return false}
    if(f.bus.length&&!f.bus.includes(p.bus||NR)) return false;
    if(A.parts.length&&!A.parts.includes(n)) return false;
    return true};
  return ex.reponses.filter(r=>okP(r.participant)&&(!f.jour.length||f.jour.includes(r.jour||NR))&&(!f.rempli.length||f.rempli.includes(r.rempli||NR)))
    .map(r=>({...r,profil:prof[r.participant]||{}}));
}
function groupRows(rows,by){
  if(by==='none') return [{name:'Tous',rows}];
  const m=new Map(); const add=(k,r)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(r)};
  rows.forEach(r=>{
    if(by==='participant') add(r.participant,r);
    else if(by==='statut') add(r.profil.statut||NR,r);
    else if(by==='depl'){const d=r.profil.depl||[];(d.length?d:[NR]).forEach(x=>add(x,r))}
    else if(by==='bus') add(r.profil.bus||NR,r);
    else if(by==='jour') add(r.jour||NR,r);
    else if(by==='rempli') add(r.rempli||NR,r);
  });
  const order={statut:PROFIL[0].opts,depl:PROFIL[1].opts,bus:PROFIL[2].opts,jour:['20 nov.','21 nov.'],rempli:['Seul','Avec aide']}[by];
  const names=[...m.keys()].sort((a,b)=>{if(order){const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)}return a.localeCompare(b)});
  return names.map(n=>({name:n,rows:m.get(n)}));
}
function colStats(rows,c){
  const vals=rows.map(r=>(r.reponses||{})[c.key]).filter(v=>v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length));
  const counts={}; (c.opts||[]).forEach(o=>counts[o]=0);
  vals.forEach(v=>(Array.isArray(v)?v:[v]).forEach(x=>{counts[x]=(counts[x]||0)+1}));
  let mean=null; if(scorable(c)){const sc=vals.filter(v=>typeof v==='string'&&v in SCORE);if(sc.length)mean=sc.reduce((s,v)=>s+SCORE[v],0)/sc.length}
  return {n:vals.length,counts,mean,vals};
}
function protoMetrics(rows,q){
  const rs=rows.filter(r=>r.questionnaire===q.id); if(!rs.length) return null;
  const cols=columnsOf(q); let sum=0,cnt=0;
  cols.filter(scorable).forEach(c=>{if(c.key==='usage')return;rs.forEach(r=>{const v=(r.reponses||{})[c.key];if(typeof v==='string'&&v in SCORE){sum+=SCORE[v];cnt++}})});
  const uc=cols.find(c=>c.key==='usage'); const us=uc?colStats(rs,uc):{n:0,counts:{}};
  return {n:rs.length,parts:new Set(rs.map(r=>r.participant)).size,score:cnt?sum/cnt:null,usage:us.n?us.counts['Oui']/us.n:null,aide:rs.filter(r=>r.rempli==='Avec aide').length/rs.length};
}
function cellText(rows,c){
  const st=colStats(rows,c); if(!st.n) return '';
  if(!c.opts){const nums=st.vals.map(Number);return nums.every(x=>!isNaN(x))&&nums.length>1?`moy. ${f1(nums.reduce((a,b)=>a+b,0)/nums.length)} (n=${nums.length})`:st.vals.join(' ; ')}
  if(st.n===1) return st.vals.map(v=>Array.isArray(v)?v.join(' | '):v).join('');
  return c.opts.filter(o=>st.counts[o]).map(o=>`${o} ${st.counts[o]} (${Math.round(100*st.counts[o]/st.n)} %)`).join(' ; ')+(st.mean!=null?` ; score ${f1(st.mean)}/2`:'');
}
function cellHTML(rows,c){
  const st=colStats(rows,c); if(!st.n) return '<span class="muted">—</span>';
  if(!c.opts) return esc(cellText(rows,c));
  if(st.n===1){const v=st.vals[0];return (Array.isArray(v)?v:[v]).map(x=>`<span class="pill ${toneOf(x,c.opts.indexOf(x))}">${esc(x)}</span>`).join('')}
  return c.opts.filter(o=>st.counts[o]).map(o=>`<span class="pill ${toneOf(o,c.opts.indexOf(o))}">${esc(o)} ${st.counts[o]} (${Math.round(100*st.counts[o]/st.n)} %)</span>`).join('')+(st.mean!=null?`<div class="mean">score ${f1(st.mean)} sur 2</div>`:'');
}
function barHTML(rows,c){
  const st=colStats(rows,c); if(!st.n) return '<div class="seg-empty">pas de réponse</div>';
  return '<div class="stack" role="img" aria-label="'+esc(cellText(rows,c))+'">'+c.opts.filter(o=>st.counts[o]).map(o=>`<span class="seg ${toneOf(o,c.opts.indexOf(o))}" style="flex:${st.counts[o]}" title="${esc(o)} : ${st.counts[o]}">${st.counts[o]}</span>`).join('')+'</div>';
}

  const sheets=[];
  const tabAOA=[['Question',...gs.map(g=>g.name+' ('+g.rows.length+')')],...cols.map(c=>[c.label,...gs.map(g=>cellText(g.rows,c))]),
    ['Commentaires libres',...gs.map(g=>g.rows.filter(r=>r.commentaire).map(r=>r.participant+' : '+r.commentaire).join('\n'))],
    ['Observations animateur',...gs.map(g=>g.rows.filter(r=>r.observations).map(r=>r.participant+' : '+r.observations).join('\n'))]];
  const syn=[['Groupe','Questionnaires','Participants','% avec aide','Score moyen (0 à 2)','% « Oui » à l’usage',...cols.filter(c=>scorable(c)&&c.key!=='usage').map(c=>'Score : '+c.label)],
    ...gs.map(g=>{const m=protoMetrics(g.rows,q);return [g.name,m.n,m.parts,pc(m.aide),f1(m.score),pc(m.usage),...cols.filter(c=>scorable(c)&&c.key!=='usage').map(c=>f1(colStats(g.rows,c).mean))]})];
  sheets.push(['Tableau',tabAOA],['Synthèse',syn]);
  if(A.view==='tableau'){
    res.innerHTML=`<section class="card">${title}<div class="tw"><table class="cmp"><thead><tr><th>Question</th>${gs.map(g=>`<th>${gHead(g)}</th>`).join('')}</tr></thead><tbody>
    ${cols.map(c=>`<tr><td>${esc(c.label)}</td>${gs.map(g=>`<td>${cellHTML(g.rows,c)}</td>`).join('')}</tr>`).join('')}
    <tr><td>Commentaires libres</td>${gs.map(g=>`<td>${g.rows.filter(r=>r.commentaire).map(r=>`<p class="cm"><b>${esc(r.participant)}</b> ${esc(r.commentaire)}</p>`).join('')||'<span class="muted">—</span>'}</td>`).join('')}</tr>
    <tr><td>Observations de l’animateur</td>${gs.map(g=>`<td>${g.rows.filter(r=>r.observations).map(r=>`<p class="cm"><b>${esc(r.participant)}</b> ${esc(r.observations)}</p>`).join('')||'<span class="muted">—</span>'}</td>`).join('')}</tr>
    </tbody></table></div></section>`;
  } else if(A.view==='graph'){
    const chartCols=cols.filter(c=>c.opts);
    res.innerHTML=`<section class="card">${title}<p class="lead" style="margin:0 0 12px">Chaque barre montre la répartition des réponses du groupe. Le nombre dans un segment est un effectif.</p>
    ${chartCols.map(c=>`<div class="qchart"><div class="qt">${esc(c.label)}</div>${legendHTML(c.opts)}
      ${gs.map(g=>{const st=colStats(g.rows,c);return `<div class="bar-row"><div class="bl">${esc(g.name)} <small>n=${st.n}</small></div>${barHTML(g.rows,c)}<div class="bm">${st.mean!=null?f1(st.mean)+' / 2':''}</div></div>`}).join('')}</div>`).join('')}</section>`;
  } else {
    const sc=cols.filter(c=>scorable(c)&&c.key!=='usage');
    res.innerHTML=`<section class="card">${title}<p class="lead" style="margin:0 0 12px">Score = moyenne des réponses (Oui = 2, Un peu ou Peut-être = 1, Non = 0), sur 2.</p><div class="tw"><table class="cmp"><thead><tr><th>Groupe</th><th>Questionnaires</th><th>Participants</th><th>% avec aide</th><th>Score moyen</th><th>% « Oui » à l’usage</th>${sc.map(c=>`<th title="${esc(c.label)}">${esc(c.label.split(' – ').pop())}</th>`).join('')}</tr></thead><tbody>
    ${gs.map(g=>{const m=protoMetrics(g.rows,q);return `<tr><td>${esc(g.name)}</td><td>${m.n}</td><td>${m.parts}</td><td>${pc(m.aide)}</td><td><strong>${f1(m.score)}</strong></td><td>${pc(m.usage)}</td>${sc.map(c=>`<td>${f1(colStats(g.rows,c).mean)}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></section>`;
  }
  return {sheets};
}
function renderOverview(res,groups,rows){
  const protos=QS.filter(q=>rows.some(r=>r.questionnaire===q.id));
  const cell=(g,q)=>protoMetrics(g.rows,q);
  const gs=groups;
  const tabAOA=[['Prototype',...gs.map(g=>g.name)],...protos.map(q=>['Proto '+q.num+' – '+q.titre,...gs.map(g=>{const m=cell(g,q);return m?`score ${f1(m.score)}/2 ; usage Oui ${pc(m.usage)} ; n=${m.n}`:''})])];
  const synAOA=[['Groupe','Questionnaires','Participants','% avec aide',...protos.map(q=>'Score proto '+q.num),...protos.map(q=>'% Oui usage proto '+q.num)],
    ...gs.map(g=>[g.name,g.rows.length,new Set(g.rows.map(r=>r.participant)).size,pc(g.rows.filter(r=>r.rempli==='Avec aide').length/g.rows.length),...protos.map(q=>f1(cell(g,q)?.score)),...protos.map(q=>pc(cell(g,q)?.usage))])];
  const title='<h2>Vue d’ensemble des prototypes</h2>';
  if(A.view==='tableau'){
    res.innerHTML=`<section class="card">${title}<p class="lead" style="margin:0 0 12px">Pour chaque prototype et chaque groupe : score moyen sur 2, part de « Oui » à « Utiliseriez-vous ce prototype ? » et nombre de questionnaires.</p><div class="tw"><table class="cmp"><thead><tr><th>Prototype</th>${gs.map(g=>`<th>${gHead(g)}</th>`).join('')}</tr></thead><tbody>
    ${protos.map(q=>`<tr><td>Proto ${esc(q.num)} · ${esc(q.titre)}</td>${gs.map(g=>{const m=cell(g,q);return `<td>${m?`<strong>${f1(m.score)}</strong> / 2<div class="muted">usage Oui : ${pc(m.usage)}</div><div class="muted">n=${m.n}</div>`:'<span class="muted">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  } else if(A.view==='graph'){
    res.innerHTML=`<section class="card">${title}
    <div class="legend">${gs.map((g,i)=>`<span class="pill k${i%6}">${esc(g.name)}</span>`).join('')}</div>
    <div class="qt" style="margin-top:14px">Score moyen par prototype (sur 2)</div>
    ${protos.map(q=>`<div class="ov"><div class="ovl">Proto ${esc(q.num)} · ${esc(q.titre)}</div>${gs.map((g,i)=>{const m=cell(g,q);const v=m?.score;return `<div class="bar-row"><div class="bl"><small>${esc(g.name)}</small></div><div class="hb"><span class="hbf k${i%6}" style="width:${v==null?0:Math.round(v/2*100)}%"></span></div><div class="bm">${f1(v)}</div></div>`}).join('')}</div>`).join('')}
    <div class="qt" style="margin-top:22px">Part de « Oui » à « Utiliseriez-vous ce prototype dans le bus ? »</div>
    ${protos.map(q=>`<div class="ov"><div class="ovl">Proto ${esc(q.num)} · ${esc(q.titre)}</div>${gs.map((g,i)=>{const m=cell(g,q);const v=m?.usage;return `<div class="bar-row"><div class="bl"><small>${esc(g.name)}</small></div><div class="hb"><span class="hbf k${i%6}" style="width:${v==null?0:Math.round(v*100)}%"></span></div><div class="bm">${pc(v)}</div></div>`}).join('')}</div>`).join('')}</section>`;
  } else {
    res.innerHTML=`<section class="card">${title}<div class="tw"><table class="cmp"><thead><tr><th>Groupe</th><th>Questionnaires</th><th>Participants</th><th>% avec aide</th>${protos.map(q=>`<th>Score proto ${esc(q.num)}</th>`).join('')}${protos.map(q=>`<th>% Oui usage proto ${esc(q.num)}</th>`).join('')}</tr></thead><tbody>
    ${gs.map(g=>`<tr><td>${esc(g.name)}</td><td>${g.rows.length}</td><td>${new Set(g.rows.map(r=>r.participant)).size}</td><td>${pc(g.rows.filter(r=>r.rempli==='Avec aide').length/g.rows.length)}</td>${protos.map(q=>`<td>${f1(cell(g,q)?.score)}</td>`).join('')}${protos.map(q=>`<td>${pc(cell(g,q)?.usage)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  }
  return {sheets:[['Vue d\'ensemble',tabAOA],['Synthèse',synAOA]]};
}

function render(){
  renderNav();
  if(!ROLE) return viewGate();
  if(S.tab==='accueil'&&ROLE==='admin') viewAccueil();
  else if(S.tab==='data'&&ROLE==='admin') viewData();
  else (S.view==='form'?viewForm:viewHome)();
}
addEventListener('online',async()=>{if(ROLE&&getQ().length){const r=await flush();if(r.sent){S.toast=`${r.sent} saisie(s) envoyée(s) automatiquement.`;if(S.view!=='form'){S.parts=null;render()}}}});
if(!SUPABASE_URL.includes('supabase.co')||SUPABASE_URL.includes('VOTRE-PROJET')) document.addEventListener('DOMContentLoaded',()=>{});
render();

</script>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Saisie Forum Handidéal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Concept : saisie guidée sur tablette, un écran par étape (participant, choix du prototype, questions, suite). Typographie lisible, grandes zones tactiles. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --fg:#1D2130; --muted:#5A6073; --line:#C9CDD8;
  --primary:#2B3040; --on-primary:#FFFFFF; --accent:#B35F00; --accent-soft:#FDF1E0;
  --ok:#1F7A3D; --warn:#9A5B00; --focus:#0B5FD7;
  --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151C; --surface:#1D2029; --fg:#EEF0F6; --muted:#A5ABBD; --line:#3A3F50;
  --primary:#F28C00; --on-primary:#13151C; --accent:#F5A53A; --accent-soft:#2A2418;
  --ok:#5BC37D; --warn:#F5B85A; --focus:#7DB1FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151C; --surface:#1D2029; --fg:#EEF0F6; --muted:#A5ABBD; --line:#3A3F50;
  --primary:#F28C00; --on-primary:#13151C; --accent:#F5A53A; --accent-soft:#2A2418;
  --ok:#5BC37D; --warn:#F5B85A; --focus:#7DB1FF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:2px solid var(--line);margin-bottom:22px}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;font-weight:700}
.chip button{min-height:40px;padding:0 16px}
.mock{background:var(--accent-soft);border-left:6px solid var(--accent);padding:10px 14px;margin:0 0 22px;font-size:.92rem;border-radius:4px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h2{font-size:1.3rem;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 22px}
section.card{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:20px;margin:0 0 20px}
label.f{display:block;font-weight:700;margin:0 0 8px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;width:100%;min-height:52px}
textarea{min-height:130px;resize:vertical}
input.num{font-size:1.6rem;font-weight:700;letter-spacing:.08em;max-width:240px;text-transform:uppercase}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--primary);background:var(--surface);color:var(--fg);min-height:52px;padding:0 22px;font-weight:700}
button.primary{background:var(--primary);color:var(--on-primary)}
button.ghost{border-color:var(--line);font-weight:400}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.err{color:var(--warn);font-weight:700;margin:8px 0 0}
.ok{color:var(--ok);font-weight:700}
/* options */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;min-width:96px;padding:8px 18px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-weight:700}
.opt input:checked+span{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.opt input:focus-visible+span{outline:4px solid var(--focus);outline-offset:2px}
.opt input[type=checkbox]:checked+span::before{content:"\2713\00a0"}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q>.t{font-weight:700;margin:0 0 10px}
.q>.h{color:var(--muted);font-size:.9rem;margin:-6px 0 10px}
.scalerow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px 18px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.scalerow:first-of-type{border-top:0}
.scalerow .opts{flex-wrap:nowrap}
.scalerow .opt{flex:1}
.scalerow .opt span{min-width:0;padding:8px 6px}
.mrow{padding:12px 0;border-top:1px dashed var(--line)}
.mrow:first-of-type{border-top:0}
.mcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mcols .c{font-size:.9rem;color:var(--muted);margin:0 0 4px;font-weight:700}
.opts.tight{flex-wrap:nowrap}.opts.tight .opt{flex:1}.opts.tight .opt span{min-width:0;padding:8px 4px}
.timing{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.timing .hd{font-size:.82rem;color:var(--muted);font-weight:700}
.timing input,.timing select{min-height:46px;padding:8px 10px}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.proto{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:112px;padding:14px 16px;background:var(--surface);border:2px solid var(--line);width:100%}
.proto:hover{border-color:var(--primary)}
.proto .n{font-size:.85rem;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.proto .tt{font-size:1.1rem;font-weight:700}
.proto.done{border-color:var(--ok)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;margin-bottom:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.bar .prog{color:var(--muted);font-size:.95rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.tw{overflow-x:auto}
pre.csv{background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px;max-height:220px;overflow:auto;font-size:.8rem;white-space:pre}
.bigchoice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.bigchoice button{min-height:96px;font-size:1.15rem;text-align:left;padding:14px 18px}
.bigchoice button small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.bigchoice button.primary small{color:inherit;opacity:.85}
@media(max-width:560px){body{font-size:17px}.scalerow{grid-template-columns:1fr}.timing{grid-template-columns:1fr 1fr}.timing .hd{display:none}.timing .fmt{grid-column:1/-1;font-weight:700}}
@media(prefers-reduced-motion:no-preference){button,.opt span{transition:background .12s,border-color .12s}}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:46px;padding:0 18px;border-color:var(--line);font-weight:700}
.tabs button[aria-current=page]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.roleinfo{color:var(--muted);font-size:.9rem;margin:-8px 0 18px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-height:300px;overflow:auto;padding:4px}
.pchip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;padding:6px 8px;background:var(--bg);border:2px solid var(--line);font-weight:700}
.pchip small{font-weight:400;color:var(--muted);font-size:.8rem}
.pchip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pchip[aria-pressed=true] small{color:inherit;opacity:.85}
.toast{background:var(--surface);border:2px solid var(--ok);border-left-width:8px;border-radius:8px;padding:12px 16px;margin:0 0 20px;font-weight:700}
.proto:disabled{opacity:.5;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--surface);color:var(--fg);border:3px solid var(--warn);border-radius:12px;max-width:520px;width:100%;padding:22px}
.dlg h2{margin:0 0 8px}
.pilltag{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.88rem;margin:2px 6px 2px 0;background:var(--bg)}
.timing{grid-template-columns:minmax(0,1.3fr) repeat(5,minmax(0,1fr))}
@media(max-width:560px){.timing{grid-template-columns:1fr 1fr}}
</style>
</head>

/* ---------- Configuration Supabase (à renseigner, voir le guide) ---------- */
const SUPABASE_URL='https://crnbixqyjzgmageheizt.supabase.co';
const SUPABASE_KEY='sb_publishable_fvSQOvj33AVlCgFcypuXJA_ZCFYbteR';

/* ---------- Accès à la base (fonctions RPC, voir supabase_setup.sql) ---------- */
let CODE='', ROLE='';
try{CODE=sessionStorage.getItem('hd_code')||'';ROLE=sessionStorage.getItem('hd_role')||''}catch(e){}
async function api(fn,args){
  const h={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
  if(SUPABASE_KEY.startsWith('eyJ')) h['Authorization']='Bearer '+SUPABASE_KEY;
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:h,body:JSON.stringify(args)});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){} const e=new Error(m||('Erreur '+r.status));e.status=r.status;throw e}
  const t=await r.text(); return t?JSON.parse(t):null;
}
/* File d'attente locale : une saisie n'est jamais perdue si le réseau coupe */
const QKEY='hd_queue_v1';
function getQ(){try{return JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){return []}}
function setQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
async function flush(){
  let q=getQ(), sent=0, last='';
  for(const it of [...q]){
    try{await api('submit_reponse',it.args); q=getQ().filter(x=>x.id!==it.id); setQ(q); sent++}
    catch(e){ if(e.status===undefined) {last='réseau indisponible';break} last=e.message; it.err=e.message; setQ(getQ().map(x=>x.id===it.id?it:x)) }
  }
  return {sent,left:getQ().length,last};
}

function optHTML(name,opts,type,checked,extraCls='',disabledSet){
  return `<div class="opts ${extraCls}">`+opts.map(o=>{
    const c=Array.isArray(checked)?checked.includes(o):checked===o;
    const dis=disabledSet&&disabledSet.has(o)?'disabled':'';
    return `<label class="opt"><input type="${type}" name="${esc(name)}" value="${esc(o)}" ${c?'checked':''} ${dis}><span>${esc(o)}</span></label>`}).join('')+'</div>';
}

/* ---------- Formulaire ---------- */
function itemHTML(it){
  const k=it.id, t=`<div class="t">${esc(it.q)}${it.max?'':''}</div>`;
  if(it.type==='single') return `<div class="q" data-it="${k}">${t}${optHTML(k,it.opts,'radio',S.ans[k])}</div>`;
  if(it.type==='multi'){
    const cur=S.ans[k]||[]; const dis=it.max&&cur.length>=it.max?new Set(it.opts.filter(o=>!cur.includes(o))):null;
    return `<div class="q" data-it="${k}">${t}${optHTML(k,it.opts,'checkbox',cur,'',dis)}</div>`}
  if(it.type==='scale') return `<div class="q" data-it="${k}">${t}${it.rows.map((r,i)=>`<div class="scalerow"><div>${esc(r)}</div>${optHTML(k+'.'+i,it.opts,'radio',S.ans[k+'.'+i])}</div>`).join('')}</div>`;
  if(it.type==='matrix') return `<div class="q" data-it="${k}">${t}${it.rows.map((r,i)=>`<div class="mrow"><div style="font-weight:700;margin-bottom:8px">${esc(r)}</div><div class="mcols">${it.cols.map((c,j)=>`<div><div class="c">${esc(c)}</div>${optHTML(k+'.'+i+'.'+j,it.opts,'radio',S.ans[k+'.'+i+'.'+j],'tight')}</div>`).join('')}</div></div>`).join('')}</div>`;
  if(it.type==='timing'){
    const H='<div class="hd">Format (trajet)</div><div class="hd">Ordre de passage</div><div class="hd">Montée (s)</div><div class="hd">Arrêt avant (s)</div><div class="hd">Descente (s)</div><div class="hd">3 arrêts trouvés ?</div>';
    return `<div class="q" data-it="${k}">${t}<div class="timing">${H}${it.rows.map((r,i)=>{
      const v=n=>esc(S.ans[k+'.'+i+'.'+n]||'');
      const sel=(n,opts,lab)=>`<select data-k="${k}.${i}.${n}" aria-label="${lab}"><option value="">${lab==='Ordre de passage'?'Ordre':'—'}</option>${opts.map(o=>`<option ${S.ans[k+'.'+i+'.'+n]===o?'selected':''}>${o}</option>`).join('')}</select>`;
      return `<div class="fmt">${esc(r)}</div>${sel('o',['1er','2e','3e'],'Ordre de passage')}
      ${['m','a','d'].map(n=>`<input type="number" min="0" inputmode="numeric" data-k="${k}.${i}.${n}" value="${v(n)}" aria-label="${n==='m'?'Montée':n==='a'?'Arrêt avant':'Descente'} en secondes" placeholder="s">`).join('')}${sel('t',['Oui','Non'],'Trouvés')}`}).join('')}</div></div>`;
  }
  return '';
}
function requiredKeys(q){
  const ks=[];
  q.items.forEach(it=>{
    if(it.optional) return;
    if(it.type==='single') ks.push(it.id);
    if(it.type==='scale') it.rows.forEach((r,i)=>ks.push(it.id+'.'+i));
  });
  return ks;
}

  const q=QS.find(x=>x.id===S.qid);
  app.innerHTML=`

    <div class="q"><div class="t"><label for="obs">Observations (hésitations, difficultés, aide demandée)</label></div><textarea id="obs" style="min-height:90px">${esc(S.obs)}</textarea></div>
  </section>
  <div id="warn" class="err" hidden></div>
  <div class="row"><button class="primary" id="saveBtn">Enregistrer le questionnaire</button></div>`;
  const upd=()=>{const rk=requiredKeys(q);const n=rk.filter(k=>S.ans[k]).length;$('#prog').textContent=`${n} réponse${n>1?'s':''} sur ${rk.length} questions à cocher`};
  const all=[...q.items,...(q.anim||[])];
  app.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(i=>i.onchange=()=>{
    const n=i.name;
    if(n==='aide'){S.aide=i.value;return}
    if(n==='jour'){S.jour=i.value;return}
    if(i.type==='checkbox'){
      const set=new Set(S.ans[n]||[]);i.checked?set.add(i.value):set.delete(i.value);S.ans[n]=[...set];
      const it=all.find(x=>x.id===n); if(it&&it.max){
        app.querySelectorAll(`input[name="${n}"]`).forEach(c=>{c.disabled=S.ans[n].length>=it.max&&!c.checked});
      }
    } else S.ans[n]=i.value;
    S.warned=false;$('#warn').hidden=true;$('#saveBtn').textContent='Enregistrer le questionnaire';upd();
  });
  app.querySelectorAll('[data-k]').forEach(i=>{i.oninput=()=>{S.ans[i.dataset.k]=i.value};i.onchange=i.oninput});
  $('#comment').oninput=e=>S.comment=e.target.value; $('#obs').oninput=e=>S.obs=e.target.value;
  $('#back').onclick=()=>{S.view='home';render();window.scrollTo(0,0)};
  $('#saveBtn').onclick=async()=>{
    const rk=requiredKeys(q);const miss=rk.filter(k=>!S.ans[k]).length;
    if(miss&&!S.warned){S.warned=true;const w=$('#warn');w.hidden=false;w.textContent=`${miss} question${miss>1?'s':''} sans réponse. Complétez-les ou enregistrez quand même.`;$('#saveBtn').textContent='Enregistrer quand même';return}
    const btn=$('#saveBtn'); btn.disabled=true; btn.textContent='Enregistrement…';
    const args={p_code:CODE,p_client_id:uid(),p_participant:S.pid,p_questionnaire:q.id,p_jour:S.jour,p_rempli:S.aide,p_reponses:{...S.ans},p_commentaire:S.comment,p_observations:S.obs};
    const qq=getQ(); qq.push({id:args.p_client_id,args}); setQ(qq);
    const r=await flush(); const pid=S.pid;
    S.toast=r.left?`Prototype ${q.num} gardé en attente pour ${pid} (${r.last||'à renvoyer'}). Il sera envoyé dès que possible.`:`Prototype ${q.num} enregistré pour ${pid}.`;
    S.pid=null;S.filter='';S.view='home';S.parts=null;render();window.scrollTo(0,0);
  };
  upd();
}


/* ---------- Données (admin) : contrôle + export ---------- */
function csvLong(ex){
  const out=['participant;prototype;date;jour;rempli;code_question;valeur'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  ex.reponses.forEach(r=>{
    const base=[r.participant,r.questionnaire,r.created_at,r.jour||'',r.rempli||''];
    Object.entries(r.reponses||{}).forEach(([k,v])=>out.push([...base,r.questionnaire+'.'+k,q(Array.isArray(v)?v.join(' | '):v)].join(';')));
    out.push([...base,r.questionnaire+'.commentaire',q(r.commentaire)].join(';'));
    out.push([...base,r.questionnaire+'.observations',q(r.observations)].join(';'));
  });
  const pr=['participant;statut;deplacement;bus;essais;etude'];
  ex.participants.forEach(p=>{const f=p.profil||{};pr.push([p.numero,f.statut||'',(f.depl||[]).join(' | '),f.bus||'',f.essais||'',f.etude||''].join(';'))});
  return out.join('\n')+'\n\n'+pr.join('\n');
}

  $('#copy').onclick=async()=>{
    try{await navigator.clipboard.writeText(csvLong(ex));$('#copied').textContent='Copié.'}
    catch(e){const r=document.createRange();r.selectNodeContents($('#csv'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#copied').textContent='Texte sélectionné, copiez-le avec Ctrl+C.'}
  };
  $('#dl').onclick=()=>{
    const blob=new Blob(['﻿'+csvLong(ex)],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='handideal_forum_resultats.csv';document.body.appendChild(a);a.click();a.remove();
  };
}

function render(){
  renderNav();
  if(!ROLE) return viewGate();
  if(S.tab==='accueil'&&ROLE==='admin') viewAccueil();
  else if(S.tab==='data'&&ROLE==='admin') viewData();
  else (S.view==='form'?viewForm:viewHome)();
}
addEventListener('online',async()=>{if(ROLE&&getQ().length){const r=await flush();if(r.sent){S.toast=`${r.sent} saisie(s) envoyée(s) automatiquement.`;if(S.view!=='form'){S.parts=null;render()}}}});
if(!SUPABASE_URL.includes('supabase.co')||SUPABASE_URL.includes('VOTRE-PROJET')) document.addEventListener('DOMContentLoaded',()=>{});
render();

</script>
</body>
